        $(function(){
            //Produkty dodane na poczatek maja zielony kolor tekstu, a dodane na koniec niebieski
            //Po dodaniu pole tekstowe ma się wyczyścić. Jesli pole jest puste, nic nie jest dodawane
            $("#naKoniec").click(function(){
                let value = $("input").val();
                if(value.length > 0){
                    $("ul").append("<li>" + value + "</li>")
                    $("li").last().css({
                        "color": "blue",
                        "font-weight": "bold"
                    })
                }
                $("input").val("");
                
            })
            
            $("#naPoczatek").click(function(){
                let value = $("input").val();
                if(value.length > 0){
                    $("ul").prepend("<li>" + value + "</li>")
                    $("li").first().css({
                        "color": "green",
                        "font-weight": "bold"
                    })
                }
                
            })
        })

    </script>
