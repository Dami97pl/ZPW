        $(function(){
            $("#tekst").on("input",function(){
                $("#podglad").text($(this).val())
            })
        })
        //--------------------------------------------------------------------------------------------------------
        //6
        //Zrób pole textarea na komentarz (max 100 znaków) i pod nim licznik ,,Pozostało znaków: 100". Licznik ma się zmniejszać podczas pisania. Gdy zostanie mniej niż 10 znaków, licznik ma zmienić kolor na czerwony.
        $(function(){
            $("#komentarz").on("input", function(){
                let charLeft = 100 - Number($(this).val().length);
                $("#licznik").text(charLeft)

                if(charLeft < 10){
                    $("#licznik").css("color", "red")
                } else{
                    $("#licznik").css("color", "black")
                }
            })
        })
