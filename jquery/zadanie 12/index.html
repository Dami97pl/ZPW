        // Zadanie: Zrób formularz z polami "Email" i "Hasło". 
        // Przy wysyłaniu sprawdź czy hasło ma co najmniej 6 znaków. 
        // Jeśli nie, wyświetl na czerwono "Hasło jest za krótkie", a jesli tak, na zielono "Zalogowano". 
        // Wskazówka: długość tekstu sprawdzisz przez .length, a kolor zmienisz metodą .css("kolor", "red").
    
        $(function(){
            $("#formularz").submit(function(e){
                e.preventDefault();
                var haslo = $("#haslo").val();
                if(haslo.length < 6){
                    $("#wyp").text("Haslo jest za krotkie");
                    $("#wyp").css("color", "red");
                } else{
                    $("#wyp").text("Zalogowano").css("color", "green");
                }
            })
        })
    
    </script>
