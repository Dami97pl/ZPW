<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <title>Document</title>
    <style>
        .slabe{
            background-color: red;
        }

        .srednie{
            background-color: orange;
        }

        .silne{
            background-color: green;
        }
    </style>
    <script>
        // Zadanie 1: Wyszukiwarka z klawiszami
        // Po wciśnięciu Enter wypisz w #wynik: „Szukam: [tekst]”. Jeśli pole jest puste (po trim()), wypisz „Wpisz frazę!” na czerwono.
        // Po wciśnięciu Escape wyczyść pole i #wynik.
        $(function(){
            $(document).on("keyup", function(event){
                if(event.key == "Enter"){
                    let tekst = $("#szukaj").val().trim();
                    $("#wynik").css("color", "black");
                    if(tekst.length > 0){
                        $("#wynik").text("Szukam: " + tekst);
                    } else{
                        $("#wynik").text("Wpisz frazę!");
                        $("#wynik").css("color", "red");
                    }
                } else if(event.key == "Escape"){
                    $("#wynik").text("")
                    $("#szukaj").val("")
                }
            })
        })

        //Zadanie 2: Limit długości hasła
        // Przy każdym zdarzeniu input sprawdzaj długość hasła:
        // -mniej niż 6 znaków → „Słabe”, klasa .slabe (czerwone tło),
        // -6–9 znaków → „Średnie”, klasa .srednie (pomarańczowe),
        // -10 i więcej → „Silne”, klasa .silne (zielone).
        $(function(){
            $("#haslo").on("input", function(){
                let haslo = $("#haslo").val();
                if(haslo.length < 6){
                    $("#sila").text("Słabe");
                    $("#sila").addClass("slabe");
                    $("#sila").removeClass("srednie");
                    $("#sila").removeClass("silne");
                } else if(haslo.length > 6 && haslo.length < 9){
                    $("#sila").text("Średnie");
                    $("#sila").addClass("srednie");
                    $("#sila").removeClass("slabe");
                    $("#sila").removeClass("silne");
                } else if(haslo.length >= 10){
                    $("#sila").text("Silne");
                    $("#sila").addClass("silne");
                    $("#sila").removeClass("slabe");
                    $("#sila").removeClass("srednie");
                }
            })
        })

        //Zadanie 3: Formularz logowania
        //Zablokuj wysłanie formularza (preventDefault). Jeśli login jest pusty → „Podaj login”. Jeśli hasło ma mniej niż 6 znaków → „Hasło za krótkie”. W przeciwnym razie → „Witaj, [login]!” na zielono.
        $(function(){
            $("#logowanie").click(function(e){
                e.preventDefault();
                let login = $("#login").val().trim();
                let haslo = $("#pass").val().trim();

                if(login === ""){
                    $("#info").text("Podaj login");
                } else if(haslo.length < 6){
                    $("#info").text("Haslo za krotkie");
                } else{
                    $("#info").text("Witaj " + login);
                    $("#info").css("color", "green");
                }
            })
        })

        // $(function(){
        //     $("#formularz").submit(function(e){
        //         e.preventDefault();
        //         if($("#haslo").length < 6){
        //             $("#wyp").text("Haslo jest za krotkie");
        //             $("#wyp").css("color", "red");
        //         } else{
        //             $("#wyp").text("Zalogowano");
        //         }
        //     })
        // })

        //Zadanie 4: Wybór rozmiaru czcionki
        //Po zmianie opcji ustaw font-size akapitu #tekst na wybraną wartość w pikselach. Dodatkowo wypisz pod spodem „Aktualny rozmiar: X px”.
        $(function(){
            $("#rozmiar").on("change", function(){
                let wart = $("#rozmiar").val();
                $("#tekst").css("font-size", wart+"px");
                $("#xD").text("Aktualny rozmiar: " + wart+" px");
            })
        })

        //Zadanie 5: Zamówienie z dodatkami
        // Cena bazowa to 20 zł. Po zaznaczeniu lub odznaczeniu dodatku przelicz sumę (wskazówka: $(".dodatek:checked").each(...) i Number()).
        // Przycisk „Zamów” jest aktywny tylko, gdy zaznaczono #akcept.
        $(function(){
            let suma = 20;
            $(".dodatek").change(function(){
                if($(this).prop("checked")){
                    suma += Number($(this).val());
                }else{
                    suma -= Number($(this).val());
                }
                $("#suma").text(suma);
            })
            $("#akcept").change(function(){
                $("#zamow").prop("disabled", !$(this).prop("checked"));
            })
        })
        //Zadanie 6: Kalkulator BMI z walidacją
        // Po kliknięciu sprawdź:
        // czy oba pola są wypełnione (trim()),
        // czy to liczby (isNaN),
        // czy waga mieści się w zakresie 20–300, a wzrost w zakresie 100–250.

        // Przy błędzie wypisz odpowiedni komunikat na czerwono. Jeśli wszystko jest w porządku, wylicz BMI (waga / (wzrost/100)²), zaokrąglij do 1 miejsca (toFixed(1)) i wypisz wynik.
        $(function(){
           $("#licz").click(function(){
                let waga = $("#waga").val().trim();
                let wzrost = $("#wzrost").val().trim();

                if(waga === "" || wzrost === ""){
                    $("#bmi").text("Pola nie mogą być puste!");
                    $("#bmi").css("color", "red");
                }else if(isNaN(waga) || isNaN(wzrost)){
                    $("#bmi").text("Pola muszą być liczbami!");
                    $("#bmi").css("color", "red");
                }else if(waga <= 20 || waga >= 300){
                    $("#bmi").text("Waga musi być w zakresie 20-300!");
                    $("#bmi").css("color", "red");
                }else if(wzrost <= 100 || wzrost >= 250){
                    $("#bmi").text("Wzrost musi być w zakresie 100-250!");
                    $("#bmi").css("color", "red");
                }else{
                    let wynik = waga / ((wzrost/100)*(wzrost/100));
                    wynik = wynik.toFixed(1);
                    $("#bmi").text("Wynik BMI: " + wynik);
                    $("#bmi").css("color", "black");
                }
            })
        })
    </script>
    <style>

    </style>
</head>
<body>
    <!-- 1 -->
    <input type="text" id="szukaj" placeholder="Szukaj...">
    <p id="wynik"></p>
    <hr>

    <!-- 2 -->
    <input type="password" id="haslo">
    <p id="sila"></p>
    <hr>

    <!-- 3 -->
     <form id="logowanie">
    <input type="text" id="login" placeholder="Login">
    <input type="password" id="pass" placeholder="Hasło">
    <button type="submit">Zaloguj</button>
    </form>
    <p id="info"></p>
    <hr>

    <!-- 4 -->
    <select id="rozmiar">
        <option value="14">Mały</option>
        <option value="20">Średni</option>
        <option value="28">Duży</option>
    </select>
    <p id="tekst">Przykładowy tekst akapitu.</p>
    <p id="xD"></p>
    <hr>

    <!-- 5 -->
    <label><input type="checkbox" class="dodatek" value="3"> Ser (3 zł)</label>
    <label><input type="checkbox" class="dodatek" value="5"> Szynka (5 zł)</label>
    <label><input type="checkbox" class="dodatek" value="4"> Pieczarki (4 zł)</label>
    <p>Cena: <span id="suma">20</span> zł</p>
    <label><input type="checkbox" id="akcept"> Potwierdzam zamówienie</label>
    <button id="zamow" disabled>Zamów</button>
    <hr>

    <!-- 6 -->
    <input type="text" id="waga" placeholder="Waga (kg)">
    <input type="text" id="wzrost" placeholder="Wzrost (cm)">
    <button id="licz">Oblicz</button>
    <p id="bmi"></p>

</body>
</html>
