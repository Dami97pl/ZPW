<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <title>Document</title>
    <script>
        //1
        $(function(){
            $("#sprawdz").click(function(){
                let imie = $("#imie").val().trim()
                if(imie === ""){
                    $("#blad").text("Pole imie jest wymagane")
                } else{
                    $("#blad").text("Twoje imie to: " + imie)
                }
            })
        })
        //2
        //Zrób formularz z polem "Nazwisko" i przyciskiem "Wyślij". Przy wysyłaniu (zdarzenie submit) sprawdź, czy nazwisko nie jest puste ani nie składa się z samych spacji. Jesli jest błąd, wyświetl na czerwono "Podaj nazwisko". Jeśli wszystko jest dobrze, wyświetl na zielono "Wysłano formularz" 
        $(function(){
            $("#formularz").submit(function(e){
                e.preventDefault();
                let nazwisko = $("#nazwisko").val().trim();
                if(nazwisko === ""){
                    $("#p2").css("color", "red")
                    $("#p2").text("Pole jest wymagane")
                } else{
                    $("#p2").css("color", "green")
                    $("#p2").text("Wysłano")
                }
            })
        })
        //3
        $(function(){
            $("#sprawdzWiek").click(function(){
                let wiek = $("#wiek").val()
                if(isNaN(wiek)){
                    $("#bladWiek").text("Wiek musi byc liczba")
                }else{
                    $("#bladWiek").text("Masz " + wiek + " lat")
                }
            })
        })
        //4
        //Zrob pole "Ocena" i przycisk "Zapisz". Ocena musi być liczbą od 1 do 6. Wyświetl ,,To nie jest liczba", ,,Ocena musi byc z zakresu 1-6" albo "Zapisano ocenę: [ocena]". Pamiętaj, żeby puste pole tez potraktowac jako błąd.
        $(function(){
            $("#sprawdzOcene").click(function(){
                let ocena = $("#ocena").val();
                if(isNaN(ocena) || ocena < 1 || ocena > 6){
                    $("#bladOcena").text("Ocena musi byc liczba od 1 do 6")
                }else{
                    $("#bladOcena").text("Ocena: " + ocena)
                }
            })
        })
    </script>
    <style>

    </style>
</head>
<body>
    <!-- 1 -->
    <input type="text" id="imie">
    <button id="sprawdz">Sprawdz</button>
    <p id="blad"></p>
    <hr>

    <!-- 2 -->
    <form id="formularz">
        <input type="text" id="nazwisko">
        <button>wyslij</button>
        <p id="p2"></p>
    </form>
    <hr>

    <!-- 3 -->
    <input type="text" id="wiek">
    <button id="sprawdzWiek">Sprawdz</button>
    <p id="bladWiek"></p>

    <!-- 4 -->
    <input type="text" id="ocena">
    <button id="sprawdzOcene">Sprawdz</button>
    <p id="bladOcena"></p>
</body>
</html>
